<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1E93AB"/>
    </marker>
    <marker id="arr-grey" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#555"/>
    </marker>
  </defs>

  <!-- Tác tử box -->
  <rect x="40" y="60" width="180" height="160" rx="16"
        fill="#bfe2eb" stroke="#1E93AB" stroke-width="3"/>
  <text x="130" y="135" text-anchor="middle" font-size="58">🤖</text>
  <text x="130" y="195" text-anchor="middle" font-size="26" font-weight="700" fill="#1E93AB">Tác tử</text>

  <!-- Môi trường box -->
  <rect x="500" y="60" width="180" height="160" rx="16"
        fill="#d8f0d8" stroke="#34a853" stroke-width="3"/>
  <text x="590" y="135" text-anchor="middle" font-size="58">🌍</text>
  <text x="590" y="195" text-anchor="middle" font-size="26" font-weight="700" fill="#34a853">Môi trường</text>

  <!-- Action arrow (top, agent → env) -->
  <line x1="225" y1="110" x2="492" y2="110" stroke="#1E93AB" stroke-width="3.5"
        marker-end="url(#arr-blue)"/>
  <text x="358" y="98" text-anchor="middle" font-size="22" fill="#1E93AB" font-weight="700">
    Hành động <tspan font-style="italic">a</tspan><tspan font-size="16" dy="4">t</tspan>
  </text>

  <!-- Feedback arrows (bottom, env → agent) — two separate arrows for state and reward -->
  <line x1="495" y1="155" x2="228" y2="155" stroke="#555" stroke-width="3"
        marker-end="url(#arr-grey)"/>
  <text x="358" y="148" text-anchor="middle" font-size="19" fill="#333">
    Trạng thái <tspan font-style="italic">s</tspan><tspan font-size="14" dy="4">t+1</tspan>
  </text>

  <line x1="495" y1="195" x2="228" y2="195" stroke="#E62727" stroke-width="3"
        marker-end="url(#arr-grey)"/>
  <text x="358" y="188" text-anchor="middle" font-size="19" fill="#E62727" font-weight="600">
    Phần thưởng <tspan font-style="italic">r</tspan><tspan font-size="14" dy="4">t+1</tspan>
  </text>
</svg>
