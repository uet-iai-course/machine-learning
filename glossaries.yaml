# Glossary thuật ngữ ML cho course "Học máy" (slug: hoc-may).
#
# Mục đích:
# - Tham chiếu nhanh khi soạn / dịch câu hỏi (xem
#   `docs/dev/question-authoring-standards.md` §8).
# - Nguồn dữ liệu cho `scripts/audit_question_standards.py` —
#   union các trường `abbrev` của tất cả file `*.yml` trong thư mục
#   này dùng để check W-ABBREV (viết tắt phải có intro `(full form, ABBR)`
#   tại lần đầu xuất hiện trong stem+options).
#
# Schema (mỗi entry là dict, thứ tự field tự do):
#   en:      str  — thuật ngữ tiếng Anh chuẩn (lowercase trừ tên riêng).
#   vi:      str  — bản dịch tiếng Việt mặc định cho course này.
#   abbrev:  str  — viết tắt (optional). Audit script sẽ check intro.
#   notes:   str  — gợi ý dùng / cảnh báo nhầm lẫn (optional).
#   aliases: list — viết tắt phụ (optional, vd k-NN ↔ kNN).
#
# Quy ước: GV course có thể chọn cách dịch khác nếu phù hợp ngữ cảnh, nhưng
# nên giữ nhất quán trong cùng course. Khi dịch khác, ghi chú trong `notes`
# hoặc tạo entry mới với cùng `en` nhưng `vi` khác (audit không cấm).

