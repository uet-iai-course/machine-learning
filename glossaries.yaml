# ── Linear regression mở rộng (Topic 2) ────────────────────
- {en: residual standard error,   abbrev: RSE, vi: sai số chuẩn dư,  notes: 'ước lượng $\hat\sigma$ của độ lệch chuẩn nhiễu; $\sqrt{RSS/(n-p-1)}$'}
- {en: explained sum of squares,  abbrev: ESS, vi: tổng bình phương được giải thích,  notes: '$\sum (\hat{y}_i - \bar{y})^2$ — biến thiên của giá trị dự đoán quanh trung bình'}
- {en: false discovery rate,      abbrev: FDR, vi: tỉ lệ phát hiện sai,  notes: 'phương pháp Benjamini-Hochberg điều chỉnh đa kiểm định'}
- {en: television channel,        abbrev: TV,  vi: kênh truyền hình, notes: 'cột TV trong dataset Advertising (ISLR); ngân sách quảng cáo theo kênh'}
- {en: United States dollar,      abbrev: USD, vi: đô la Mỹ, notes: 'đơn vị tiền tệ trong các ví dụ ngân sách quảng cáo'}
- {en: hat matrix,                          vi: ma trận chiếu, notes: 'còn gọi là projection matrix; H = X(X^T X)^(-1) X^T'}
- {en: projection matrix,                   vi: ma trận chiếu}
- {en: idempotent,                          vi: luỹ đẳng,  notes: 'tính chất H^2 = H của ma trận chiếu'}
- {en: column space,                        vi: không gian cột}
- {en: heteroscedasticity,                  vi: phương sai sai số không đồng đều}
- {en: homoscedasticity,                    vi: phương sai sai số đồng đều}
- {en: autocorrelation,                     vi: tự tương quan}
- {en: weighted least squares,    abbrev: WLS, vi: bình phương tối thiểu có trọng số}
- {en: outlier,                             vi: điểm ngoại lai}
- {en: leverage point,                      vi: điểm có đòn bẩy cao}
- {en: leverage statistic,                  vi: thống kê đòn bẩy}
- {en: studentized residual,                vi: phần dư chuẩn hoá}
- {en: confidence interval,       abbrev: CI, vi: khoảng tin cậy}
- {en: prediction interval,       abbrev: PI, vi: khoảng dự đoán}
