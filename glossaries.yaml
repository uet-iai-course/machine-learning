# ── Phi tuyến — Topic 6 mở rộng ────────────────────────────
- {en: piecewise polynomial,      vi: đa thức từng mảnh,            notes: 'khớp đa thức bậc thấp riêng trên từng đoạn ngăn bởi các nút'}
- {en: cubic spline,              vi: spline bậc ba,                notes: 'piecewise cubic + ràng buộc liên tục đến đạo hàm bậc 2 tại nút; DoF $= K + 4$'}
- {en: natural cubic spline,      abbrev: NCS, vi: spline bậc ba tự nhiên,  notes: 'cubic spline + ràng buộc tuyến tính ngoài 2 nút biên; DoF $= K$, ổn định hơn ở biên'}
- {en: regression spline,         vi: spline hồi quy,               notes: 'spline với số nút cố định chọn thủ công, ngược với smoothing spline'}
- {en: smoothing spline,          vi: spline làm mượt,              notes: 'tối thiểu RSS + $\lambda \int (f^{\prime\prime})^2$; nghiệm là natural cubic spline với nút tại mọi điểm dữ liệu; chỉnh $\lambda$ thay vì chọn nút'}
- {en: truncated power basis,     vi: hàm cơ sở luỹ thừa cắt cụt,   notes: '$h(x, \xi) = (x - \xi)_+^d$; cubic spline dùng $d = 3$'}
- {en: basis function,            vi: hàm cơ sở,                    notes: '1, $x$, $x^2$, $x^3$ cho phần đa thức + truncated power cho mỗi nút'}
- {en: Loess,                     vi: Loess,                        notes: 'giữ nguyên; viết tắt locally weighted scatterplot smoothing'}
- {en: tri-cube kernel,           vi: kernel tri-cube,              notes: 'kernel mặc định trong Loess: $D(t) = (1 - |t|^3)^3$ trên $|t| \le 1$'}
- {en: Epanechnikov kernel,       vi: kernel Epanechnikov,          notes: '$D(t) = 0{,}75(1 - t^2)$ trên $|t| \le 1$; kernel chuẩn'}
- {en: span,                      vi: span / nhịp,                  notes: 'tỉ lệ dữ liệu trong cửa sổ Loess; thay cho bandwidth khi dùng nearest-neighbor kernel'}
- {en: backfitting,               vi: backfitting,                  notes: 'giữ nguyên; thuật toán lặp khớp từng $f_j$ trong GAM trên phần dư riêng phần'}
- {en: partial dependence plot,   abbrev: PDP, vi: biểu đồ phụ thuộc riêng phần,  notes: 'vẽ $f_j(X_j)$ theo $X_j$ trong GAM; cho thấy ảnh hưởng riêng từng biến'}
- {en: effective degrees of freedom, vi: bậc tự do hiệu dụng,       notes: 'cho smoothing spline: $\mathrm{tr}(\mathbf{S}_\lambda)$ trong $[2, n]$'}
- {en: parametric,                vi: tham số,                       notes: 'số tham số cố định bất kể $n$ — vd polynomial regression bậc cố định'}
- {en: non-parametric,            vi: phi tham số,                   notes: 'số tham số hiệu dụng tăng theo $n$ — vd Loess, smoothing spline, k-NN'}
- {en: link function,             vi: hàm liên kết,                  notes: 'trong GAM: $g(\mathbb{E}[Y \mid X]) = \beta_0 + \sum f_j(X_j)$; identity → hồi quy, logit → phân lớp'}

